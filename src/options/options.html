<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoxHub: Settings &amp; Theme Studio</title>
  <link rel="icon" type="image/png" href="../../icons/icon-32.png">
  <link rel="stylesheet" href="../shared/settings-ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div id="pm-wallpaper-layer" class="pm-wallpaper-layer" aria-hidden="true"></div>

  <div class="opt-layout">
    <!-- Left Sidebar Navigation -->
    <aside class="opt-sidebar">
      <div class="opt-brand">
        <img src="../../icons/icon-128.png" alt="FoxHub" class="opt-brand-logo">
        <div>
          <h1 class="opt-brand-title">FoxHub</h1>
          <span class="opt-brand-badge">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            100% Local &amp; Private
          </span>
        </div>
      </div>

      <nav class="opt-nav" aria-label="Settings Categories">
        <button type="button" class="opt-nav-btn active" data-category="mail">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <span>Accounts &amp; Mail</span>
        </button>
        <button type="button" class="opt-nav-btn" data-category="appearance">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <span>Appearance &amp; Theme</span>
        </button>
        <button type="button" class="opt-nav-btn" data-category="apps">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>Apps &amp; Workspaces</span>
        </button>
        <button type="button" class="opt-nav-btn" data-category="audio">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <span>Audio &amp; Playback</span>
        </button>
        <button type="button" class="opt-nav-btn" data-category="navigation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>Navigation &amp; Shortcuts</span>
        </button>
        <button type="button" class="opt-nav-btn" data-category="backup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Backup &amp; Privacy</span>
        </button>
      </nav>

      <div class="opt-sidebar-footer">
        <p>Your emails and workspace stay strictly on your device. Zero developer servers, zero analytics, zero paywalls.</p>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="opt-main">
      <div id="opt-live-preview-box" class="opt-live-preview-box hidden">
        <div class="opt-live-preview-header">
          <span class="opt-live-dot"></span>
          <strong>Live Combination Preview</strong>
          <span id="opt-preview-summary" class="opt-muted" style="margin-left:6px;"></span>
        </div>
        <div class="opt-live-preview-stage">
          <div id="opt-preview-wallpaper" class="opt-preview-wallpaper"></div>
          <div id="opt-preview-content" class="opt-preview-content"></div>
        </div>
      </div>

      <div id="opt-settings-mount"></div>
    </main>
  </div>

  <div id="opt-toast" class="opt-toast hidden" role="status" aria-live="polite"></div>

  <script src="../shared/media-apps.js"></script>
  <script src="../shared/settings-schema.js"></script>
  <script src="../shared/themes.js"></script>
  <script src="../shared/sender-icons.js"></script>
  <script src="../shared/sound-engine.js"></script>
  <script src="../shared/gmail-client.js"></script>
  <script src="../shared/settings-ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
